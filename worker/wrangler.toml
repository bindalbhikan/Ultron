name = "bindal-telegram-bot"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Every auto run (UTC; IST = UTC + 5:30). The worker is the only scheduler; which report runs at
# which time: SCHEDULE in src/worker.js. The free plan allows 5 cron triggers per account, so one
# trigger lists many hours and weekly / monthly runs ride on daily ones (filtered in SCHEDULE).
#   :30 past  0  3  6  9 12 15 18 21  -> inventory push every 3 hours (6 AM, 9 AM ... IST)
#            1 -> 7:00 AM   SJIT + Myntra SPF report requests (return analysis request on the 15th)
#            3 -> 9:00 AM   Myntra SPF + AJIO SPF masters (AJIO tickets / replies Wed + Sat)
#            4 -> 10:00 AM  Myntra courier OTP, Myntra daily reports, stock-out alert
#            5 -> 11:00 AM  Myntra OTP retry; dead stock (1st), monthly MIS (2nd)
#            6 -> 12:00 PM  SLA warning;   8 -> 2:00 PM return analysis (15th);   9 -> 3:00 PM SLA
#            4, 8, 11 -> 10 AM, 2 PM, 5 PM  Myntra zero TD (Mon-Sat)
#           12 -> 6:00 PM   label check;  14 -> 8:00 PM evening summary
#   :00 past  4 -> 9:30 AM morning;  6 -> 11:30 AM listings;  10 -> 3:30 PM sale;
#            12 -> 5:30 PM VMS, AJIO TAT;  13 -> 6:30 PM Myntra courier scorecard
#   4:45      -> 10:15 AM weekly review (Mondays only, by SCHEDULE)
[triggers]
crons = ["30 0,1,3,4,5,6,8,9,11,12,14,15,18,21 * * *", "0 4,6,10,12,13 * * *", "45 4 * * *"]

[vars]
# Extra Telegram users allowed to send commands: the EXTRA_CHAT_IDS secret (comma-separated chat ids,
# from DMs with the bot), kept out of this file because the repo is public.
# Dashboard address for /dashboard sign-in links (SESSION_KEY secret signs them).
DASHBOARD_PAGE = "https://bindal-dashboard.bhikan-serein.workers.dev"

# What Ultron may start after an Approve tap (ultron/worker/agent.js): the same workflows
# and inputs as [actions] in ../agent.toml (keep the two lists the same).
[vars.AGENT_ACTIONS]
sale = { workflow = "sale.yml", inputs = ["from", "to", "today", "snapshot"] }
vms = { workflow = "vms.yml", inputs = ["from", "to", "erp_only", "snapshot"] }
ajiotat = { workflow = "ajio-tat.yml", inputs = ["days", "orders"] }
ajiospf = { workflow = "ajio-spf.yml", inputs = ["dry_run"] }
myntraspf = { workflow = "myntra-spf.yml", inputs = [] }
invpush = { workflow = "inv-push.yml", inputs = ["dry_run"] }
morning = { workflow = "morning.yml", inputs = ["day"] }
sla = { workflow = "sla.yml", inputs = [] }
labels = { workflow = "labels.yml", inputs = [] }
stock = { workflow = "stock.yml", inputs = [] }
evening = { workflow = "evening.yml", inputs = [] }
weekly = { workflow = "weekly.yml", inputs = [] }
deadstock = { workflow = "deadstock.yml", inputs = [] }
listings = { workflow = "listings.yml", inputs = [] }
mis = { workflow = "mis.yml", inputs = ["day"] }
myntratat = { workflow = "myntra-tat.yml", inputs = [] }
returns = { workflow = "returns.yml", inputs = ["month"] }
ajioads = { workflow = "ajio-ads.yml", inputs = [] }
myntraotp = { workflow = "myntra-otp.yml", inputs = [] }
myntrareports = { workflow = "myntra-reports.yml", inputs = ["date"] }
myntrazerotd = { workflow = "myntra-zero-td.yml", inputs = [] }

# Latest numbers of each bot for the dashboard (worker/../dashboard reads the same namespace).
# The bots POST them to /api/push/<key> with the DASHBOARD_TOKEN secret.
# Workers AI (free daily allocation) for Ultron: POST /api/ai with the DASHBOARD_TOKEN.
[ai]
binding = "AI"

[[kv_namespaces]]
binding = "DASH"
id = "67db94fc82af438496705a09419c2ac3"
