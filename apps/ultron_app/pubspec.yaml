name: ultron_app
description: Ultron cross-platform operations frontend.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  http: ^1.6.0
  lucide_icons_flutter: ^4.0.3
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf

