# This seller's setup of Ultron (github.com/bindalbhikan/Ultron). Every key: examples/agent.example.toml there.
# No secrets here (the repo is public): logins and tokens stay in GitHub secrets / .env.

[company]
name = "Bindal Exports Ltd"
about = """an apparel seller on Myntra (accounts MAIN, PPMP, DBCC, FMCC), AJIO, Flipkart, Amazon,
Meesho, Nykaa, Snapdeal and COCOBLU. Orders run through OMSGuru, packing through the DigiBizz ERP."""
owner_note = "The owner writes to you on Telegram, often in Hinglish."
language = "plain English"

[github]
repo = "bindalbhikan/Ultron"
docs = "docs/bots"

[worker]
# the env vars holding the worker's address and token (the dashboard worker serves /api/ai too)
url_env = "DASHBOARD_URL"
token_env = "DASHBOARD_TOKEN"

[model]
# "auto": the best model of every provider with a key, tried in `order` (core/models.py); or one
# model first, "provider:model" (e.g. "anthropic:claude-sonnet-5-5"). The app's control panel and
# AGENT_MODEL / AGENT_MODEL_TIER / AGENT_MODEL_ORDER override these.
name = "auto"
tier = "smart"          # smart | fast
# keys: ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY (Google AI Studio), NVIDIA_API_KEY, GROQ_API_KEY;
# cloudflare = Workers AI through the worker (free daily allocation), always last as the safety net
order = ["anthropic", "openai", "google", "nvidia", "groq", "cloudflare"]

[model.prices]   # US$ per million tokens (input, output), for the cost line in the log
"@cf/openai/gpt-oss-120b" = [0.35, 0.75]
"@cf/qwen/qwen3.8-27b" = [0.45, 3.2]
"@cf/nvidia/nemotron-3-120b-a12b" = [0.5, 1.5]
"@cf/openai/gpt-oss-20b" = [0.2, 0.3]

[channels]
# OMSGuru channel names as this seller calls them
strip_prefix = ["BINDAL EXPORTS LIMITED - "]

[channels.names]
"MYNTRA" = "Myntra MAIN"
"Myntra PPMP" = "Myntra PPMP"
"Myntra DressBerry CC" = "Myntra DBCC"
"Myntra Fashfun Murcia CC" = "Myntra FMCC"
"Ajio Api" = "Ajio"
"Ajio" = "Ajio"
"Nykaa Fashion" = "Nykaa"
"Amazon" = "Amazon"
"Amazon SmartConnect WI" = "Amazon SC"

[memory]
# kept in the dashboard worker's KV (shared by every Actions run), never in this public repo
backend = "auto"

[watch]
skip =["agent-watch.yml", "agent-chat.yml", "tests.yml"]
failure_only = ["inv-push.yml"]     # runs every 3 hours: looked at only when it failed
max_steps = 6
tools = ["knowledge", "ultron.workings.agent_tools"]     # portal knowledge; the watcher can check the Myntra logins
# A failed first attempt of one of these, whose log matches retry_when, is run again once by itself.
# Not here: ajio-spf (raises tickets), inv-push (runs again in 3 hours), myntra-otp (time-bound).
retry = ["sale.yml", "vms.yml", "ajio-tat.yml", "flipkart-tat.yml", "myntra-spf.yml", "returns.yml",
         "ajio-ads.yml", "morning.yml", "sla.yml", "labels.yml", "stock.yml", "evening.yml",
         "weekly.yml", "deadstock.yml", "listings.yml", "myntra-tat.yml", "mis.yml",
         "myntra-reports.yml", "myntra-zero-td.yml", "portal-reports.yml", "business-report.yml", "ticket-followup.yml"]
lost_runner = ["myntra-zero-td.yml"]   # the office PC went away mid-run: started once on GitHub's runner (runner=cloud)
retry_when = ['Read timed out', 'ReadTimeout', 'ConnectTimeout', 'ConnectionError', 'Connection reset',
              'Connection aborted', 'RemoteDisconnected', 'Max retries exceeded',
              '\b(502|503|504) (Server Error|Bad Gateway|Service Unavailable|Gateway Time-?out)',
              'HTTP (502|503|504)\b', 'curl: \(\d+\)',
              'Temporary failure in name resolution', 'rateLimitExceeded', 'backendError']

[knowledge]
# The agent's lasting knowledge of the portals (tools knowledge_search / knowledge_read):
# docs/knowledge/README.md explains it; scripts/knowledge/learn_netcap.py learns from captures.
paths = ["docs/knowledge", "docs/PORTALS.md"]

[chat]
max_steps = 8
tools = ["runs", "omsguru", "business", "memory", "knowledge", "browser", "ultron.workings.agent_tools"]

# The shared action registry for Python, Telegram and the app.
# scripts/docs/sync_controls.py generates worker/actions.json from this section and workflow inputs.
[actions]
mastersheet = { workflow = "master-sheet.yml", inputs = ["no_upload"], about = "Build the shared SKU MasterSheet" }
# auto = true: only makes a report, so the agent runs it at once when asked; the rest change something
# outside (tickets, inventory, OTP sheet, portal requests) and wait for the owner's Approve tap.
sale = { workflow = "sale.yml", inputs = ["from", "to", "today", "sjit_request", "snapshot"], about = "Daily sale report into the SALE REPORT sheet. inputs: from, to (YYYY-MM-DD) or today=1; snapshot=current or YYYY-MM for a picture of that month's sheet instead", auto = true }
vms = { workflow = "vms.yml", inputs = ["from", "to", "snapshot", "erp_only"], about = "Myntra VMS report. inputs: from, to (YYYY-MM-DD); erp_only=1 for ERP vs VMS of yesterday and today; snapshot=current or YYYY-MM for a sheet picture", auto = true }
ajiotat = { workflow = "ajio-tat.yml", inputs = ["days", "orders"], about = "AJIO TAT master update. inputs: days (OMSGuru window), orders (FN/EX/seller order numbers to add, comma separated)" }
ajiospf = { workflow = "ajio-spf.yml", inputs = ["dry_run", "master_only", "disputes"], about = "AJIO SPF run (raises claims on AJIO). inputs: dry_run=1 for a test run" }
myntraspf = { workflow = "myntra-spf.yml", inputs = ["request", "no_upload"], about = "Myntra SPF master. no inputs" }
invpush = { workflow = "inv-push.yml", inputs = ["dry_run"], about = "OMSGuru Push Inventory on every channel. inputs: dry_run=1 to only list channels" }
morning = { workflow = "morning.yml", inputs = ["day"], about = "Morning sale report. inputs: day (YYYY-MM-DD)", auto = true }
sla = { workflow = "sla.yml", inputs = [], about = "SLA warning now. no inputs", auto = true }
labels = { workflow = "labels.yml", inputs = [], about = "ERP label check now. no inputs" }
stock = { workflow = "stock.yml", inputs = [], about = "Stock-out alert now. no inputs", auto = true }
evening = { workflow = "evening.yml", inputs = [], about = "Evening summary now. no inputs", auto = true }
weekly = { workflow = "weekly.yml", inputs = [], about = "Weekly review now. no inputs", auto = true }
deadstock = { workflow = "deadstock.yml", inputs = [], about = "Dead and slow stock report now. no inputs", auto = true }
listings = { workflow = "listings.yml", inputs = [], about = "Listing health check now. no inputs", auto = true }
mis = { workflow = "mis.yml", inputs = ["day"], about = "Monthly MIS and plan now (last month). inputs: day (YYYY-MM-DD)", auto = true }
myntratat = { workflow = "myntra-tat.yml", inputs = [], about = "Myntra courier pickup scorecard now. no inputs", auto = true }
fktat = { workflow = "flipkart-tat.yml", inputs = ["days"], about = "Flipkart dispatch TAT sheet (AGENT WORK/FLIPKART) now. inputs: days (OMSGuru window)", auto = true }
smscatchup = { workflow = "sms-catchup.yml", inputs = ["days"], about = "Returns SMS catch-up now: courier SMS of the last 2 days the phone sheet script did not file, worked again. no inputs" }
returns = { workflow = "returns.yml", inputs = ["month", "request", "fresh", "drive_input", "backfill_year", "backfill_portals", "no_upload"], about = "Return analysis of a month (Myntra x3, Ajio, Flipkart). inputs: month (YYYY-MM; default last month)", auto = true }
ajioads = { workflow = "ajio-ads.yml", inputs = ["if_missing"], about = "AJIO ads / TOT gap report now. no inputs", auto = true }
myntraotp = { workflow = "myntra-otp.yml", inputs = ["retry"], about = "Myntra courier pickup / return OTPs now. no inputs" }
myntrareports = { workflow = "myntra-reports.yml", inputs = ["date"], about = "Myntra daily reports made on the portal at 9:30 AM (orders, returns, return delivery, listings, inventory; not saved to Drive). inputs: date (YYYY-MM-DD; default yesterday)" }
myntrazerotd = { workflow = "myntra-zero-td.yml", inputs = ["runner"], about = "Myntra zero TD check now: styles of the ZERO TD sheet live on myntra.com with stock at MRP, per account. no inputs" }
fkprice = { workflow = "flipkart-price.yml", inputs = ["dry_run"], about = "Flipkart Final TP update using the owner's approved rules" }
fklisting = { workflow = "flipkart-listing-file.yml", inputs = [], about = "Flipkart listing file" }
fkcalc = { workflow = "flipkart-calc.yml", inputs = [], about = "Flipkart calculator" }
erpomsreturn = { workflow = "erp-oms-return.yml", inputs = ["dry_run"], about = "Accept ERP returns in OMSGuru" }
ticketfollowup = { workflow = "ticket-followup.yml", inputs = ["dry_run", "no_upload"], about = "Ticket follow-up" }
grouping = { workflow = "myntra-grouping.yml", inputs = ["runner", "no_upload", "status_only", "submit"], about = "Myntra colour grouping" }
myntrahistory = { workflow = "myntra-history.yml", inputs = ["from", "to"], about = "Myntra order and return history" }
businessreport = { workflow = "business-report.yml", inputs = ["portals", "from", "to", "no_upload"], about = "Build business reports from saved portal reports" }
portalreports = { workflow = "portal-reports.yml", inputs = ["month", "from", "to", "kinds", "portals", "fresh", "no_upload"], about = "Save portal reports" }
portalsale = { workflow = "portal-sale.yml", inputs = ["from", "to", "no_upload"], about = "Portal sale report from saved data" }
