name: Set up the bots
description: Python 3.12 with Ultron and its report workings, plus LibreOffice when a sheet picture is wanted
inputs:
  libreoffice:
    description: "true = install LibreOffice + poppler for --snapshot"
    required: false
    default: "false"
  browser:
    description: "true = install Patchright + its Chromium (ultron.core.browser)"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml
    # Ultron with the report workings, from this checkout
    - run: pip install -e ".[workings]"
      shell: bash
    - if: inputs.browser == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: patchright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
    - if: inputs.browser == 'true'
      run: pip install -e ".[browser]" && patchright install --with-deps chromium
      shell: bash
    - if: inputs.libreoffice == 'true'
      run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-calc poppler-utils fonts-crosextra-carlito
      shell: bash
