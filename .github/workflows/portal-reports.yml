name: Portal reports

on:
  # Started by the Telegram worker's cron (SCHEDULE in worker/src/worker.js) at 11 AM IST on the 2nd:
  # last month's order reports (Myntra x3, AJIO, Flipkart) and payment reports (Myntra x3, AJIO)
  # into Drive AGENT WORK/PORTAL REPORTS.
  workflow_dispatch:
    inputs:
      month:
        description: "Month (YYYY-MM), empty = last month"
        default: ""
      from:
        description: "Back-fill: first month (YYYY-MM), with to; AJIO's return report too"
        default: ""
      to:
        description: "Back-fill: last month (YYYY-MM)"
        default: ""
      kinds:
        description: "Only these reports: sale, return, payment (empty = all)"
        default: ""
      portals:
        description: "Only these portals, e.g. MYNTRA,AJIO (empty = all)"
        default: ""
      no_upload:
        description: "1 = test run: download only, Drive not changed"
        default: ""

concurrency:
  group: portal-reports
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # a report can take 30-45 minutes to be made; a back-fill does many months
    env:
      TZ: Asia/Kolkata
      RUN_MODE: github-actions
      # the repo is public: the run's log and output are uploaded only encrypted (scripts/github/ci_run.sh)
      ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
      # hyper log (core/hyperlog.py) and PORTAL REPORTS: Drive AGENT WORK
      AGENT_WORK_FOLDER_ID: ${{ vars.AGENT_WORK_FOLDER_ID }}
      AJIO_USERNAME: ${{ secrets.AJIO_USERNAME }}
      AJIO_PASSWORD: ${{ secrets.AJIO_PASSWORD }}
      # the AJIO ledger (SRM statement of accounts) for the AJIO payment report
      SRM_USERNAME: ${{ secrets.SRM_USERNAME }}
      SRM_PASSWORD: ${{ secrets.SRM_PASSWORD }}
      FLIPKART_EMAIL: ${{ secrets.FLIPKART_EMAIL }}
      FLIPKART_PASSWORD: ${{ secrets.FLIPKART_PASSWORD }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # the Myntra sessions are read from the worker with the dashboard token
      DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
      RETURNS_WAIT_MINUTES: ${{ vars.RETURNS_WAIT_MINUTES }}
      # inputs reach the shell only as variables, never pasted into the script
      IN_MONTH: ${{ inputs.month }}
      IN_PORTALS: ${{ inputs.portals }}
      IN_FROM: ${{ inputs.from }}
      IN_TO: ${{ inputs.to }}
      IN_KINDS: ${{ inputs.kinds }}
      IN_NO_UPLOAD: ${{ inputs.no_upload }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run report
        run: |
          set -- ${IN_MONTH:+--month "$IN_MONTH"} ${IN_PORTALS:+--portals "$IN_PORTALS"}                  ${IN_FROM:+--from "$IN_FROM"} ${IN_TO:+--to "$IN_TO"} ${IN_KINDS:+--kinds "$IN_KINDS"}
          if [ -n "$IN_NO_UPLOAD" ]; then set -- "$@" --no-upload; fi
          bash scripts/github/ci_run.sh portal-reports "$@"
      - name: Upload run output (encrypted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-reports-${{ github.run_id }}
          path: secure/
          if-no-files-found: ignore
          retention-days: 14
