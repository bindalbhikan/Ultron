name: Agent work schedule

on:
  # After every bot run: ticks its box in Drive AGENT WORK/AGENT REPORT WORK SCHEDULE REPORT.xlsx
  # (rebuilt from the GitHub run history each time, so a missed update is caught by the next one).
  # Not after the inventory push (8 runs a day): its runs are counted by the next update.
  workflow_run:
    workflows: ["AJIO ads TOT gap", "AJIO SPF run", "AJIO TAT daily update", "Flipkart TAT daily update",
                "Myntra SPF master", "Return analysis", "Daily sale report", "Myntra VMS report",
                "Morning report", "SLA warning", "Label check", "Stock-out alert",
                "Evening summary", "Weekly review", "Dead stock report", "Listing health",
                "Myntra courier scorecard", "Monthly MIS", "Myntra courier OTP", "Myntra daily reports",
                "Myntra zero TD"]
    types: [completed]
  workflow_dispatch:
    inputs:
      month:
        description: "rebuild this month only, YYYY-MM (empty = this month)"
        default: ""

permissions:
  actions: read
  contents: read

# one at a time: the workbook is downloaded, rebuilt and uploaded (a queued run replaces an older queued one)
concurrency:
  group: work-schedule
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Kolkata
      RUN_MODE: github-actions
      # the repo is public: the run's log and output are uploaded only encrypted (scripts/github/ci_run.sh)
      ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
      # hyper log (core/hyperlog.py): the run's detailed log into Drive AGENT WORK/AGENT LOGS
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      AGENT_WORK_FOLDER_ID: ${{ vars.AGENT_WORK_FOLDER_ID }}
      IN_MONTH: ${{ inputs.month }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Update the work schedule
        run: |
          set --
          if [ -n "$IN_MONTH" ]; then set -- --month "$IN_MONTH"; fi
          bash scripts/github/ci_run.sh work-schedule "$@"
      - name: Upload run output (encrypted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-schedule-${{ github.run_id }}
          path: secure/
          if-no-files-found: ignore
          retention-days: 3
