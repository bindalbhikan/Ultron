name: Flipkart Final TP update

on:
  # Started by the Telegram worker's cron (SCHEDULE in worker/src/worker.js) or by hand: GitHub's
  # own schedule started runs late or not at all.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = plan the steps only, change no price"
        default: ""

concurrency:
  # never two runs at once: Flipkart allows 2 settlement increases a day per listing
  group: flipkart-price
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata
  RUN_MODE: github-actions
  # the repo is public: the run's log and output are uploaded only encrypted (scripts/github/ci_run.sh)
  ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
  GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
  GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
  AGENT_WORK_FOLDER_ID: ${{ vars.AGENT_WORK_FOLDER_ID }}
  FLIPKART_EMAIL: ${{ secrets.FLIPKART_EMAIL }}
  FLIPKART_PASSWORD: ${{ secrets.FLIPKART_PASSWORD }}
  FK_PRICE_MAX_STEPS: ${{ vars.FK_PRICE_MAX_STEPS }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  IN_DRY_RUN: ${{ inputs.dry_run }}

jobs:
  # 5 parts at once (owner, 14 Nov 2026): one job took ~5 listings a minute, ~2,500 listings do not
  # fit one job. Each part takes its share of the listings (by listing id) and logs in on its own.
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run update (part ${{ matrix.part }} of 5)
        run: |
          set -- --part ${{ matrix.part }}/5
          if [ -n "$IN_DRY_RUN" ]; then set -- "$@" --dry-run; fi
          bash scripts/github/ci_run.sh flipkart-price "$@"
      - name: Upload run output (encrypted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flipkart-price-${{ github.run_id }}-part-${{ matrix.part }}
          path: secure/
          if-no-files-found: ignore
          retention-days: 7

  # joins the parts and sends one Telegram message with one Excel; a failed part is named
  report:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: flipkart-price-${{ github.run_id }}-part-*
          path: encrypted
      - name: Decrypt the parts
        run: |
          mkdir -p parts
          for f in encrypted/*/output.tar.gz.enc; do
            [ -f "$f" ] || continue
            d="parts/$(basename "$(dirname "$f")")"; mkdir -p "$d"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:ARTIFACT_KEY -in "$f" | tar -xz -C "$d"
          done
      - name: Report
        run: bash scripts/github/ci_run.sh flipkart-price --merge parts
      - name: Upload report output (encrypted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flipkart-price-${{ github.run_id }}-report
          path: secure/
          if-no-files-found: ignore
          retention-days: 7
