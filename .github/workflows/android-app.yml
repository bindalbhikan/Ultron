name: Ultron Phone app

on:
  # every change to the app builds it; by hand from the Actions tab too
  push:
    branches: [main]
    paths: ["android app/**", ".github/workflows/android-app.yml", "scripts/github/android_app.py"]
  workflow_dispatch:

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kolkata
      APP_VERSION_CODE: ${{ github.run_number }}
      # Drive AGENT WORK/ULTRON PHONE: the signing key (kept there, never in this public repo) and the APK
      AGENT_WORK_FOLDER_ID: ${{ vars.AGENT_WORK_FOLDER_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/setup
      - name: Signing key
        run: python scripts/github/android_app.py keystore "$RUNNER_TEMP/keys"
      - name: Build the APK
        working-directory: android app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: APK to Drive + Telegram
        run: python scripts/github/android_app.py upload "android app/app/build/outputs/apk/release/app-release.apk"
