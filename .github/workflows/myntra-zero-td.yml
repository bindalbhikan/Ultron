name: Myntra zero TD

on:
  # 10 AM, 2 PM and 5 PM IST, Monday to Saturday, started by the Telegram bot's Cloudflare cron
  # (SCHEDULE in worker/src/worker.js), or by hand / /myntrazerotd. Not GitHub's own schedule:
  # it ran hours late or not at all.
  workflow_dispatch:

concurrency:
  group: myntra-zero-td
  cancel-in-progress: false

jobs:
  run:
    # The office PC (self-hosted runner, label bindal-office): www.myntra.com refuses GitHub's own
    # runners (26 Oct 2026: HTTP 403 for every style) and answers from the office line. Its Python is
    # the runner's venv (C:\Users\Bhikan\actions-runner\venv, first on PATH in the runner's .env,
    # with Git Bash for the bash steps); the PC's clock is already IST (no TZ: Windows reads it wrong).
    runs-on: [self-hosted, bindal-office]
    timeout-minutes: 30
    env:
      RUN_MODE: github-actions
      # the repo is public: the run's log and output are uploaded only encrypted (scripts/github/ci_run.sh)
      ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MYNTRA_ZERO_TD_ACCOUNTS: ${{ vars.MYNTRA_ZERO_TD_ACCOUNTS }}
      # Drive AGENT WORK: the ZERO TD sheet is read there, each run's workbook kept there (new files
      # and folders through the Drive relay)
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_RELAY_URL: ${{ secrets.DRIVE_RELAY_URL }}
      DRIVE_RELAY_TOKEN: ${{ secrets.DRIVE_RELAY_TOKEN }}
      AGENT_WORK_FOLDER_ID: ${{ vars.AGENT_WORK_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ultron from this checkout
        shell: bash
        run: python -m pip install -q -e ".[workings]"
      - name: Check the styles on myntra.com
        shell: bash
        run: bash scripts/github/ci_run.sh myntra-zero-td
      - name: Upload run output (encrypted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myntra-zero-td-${{ github.run_id }}
          path: secure/
          if-no-files-found: ignore
          retention-days: 3
