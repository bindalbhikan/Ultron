name: Myntra zero TD

on:
  # 10 AM, 2 PM and 5 PM IST, Monday to Saturday, started by the Telegram bot's Cloudflare cron
  # (SCHEDULE in worker/src/worker.js), or by hand / /myntrazerotd. Not GitHub's own schedule:
  # it ran hours late or not at all.
  workflow_dispatch:
    inputs:
      runner:
        description: "office = the office PC; cloud = GitHub's runner, myntra.com through Ultron Phone"
        default: "office"

concurrency:
  group: myntra-zero-td
  cancel-in-progress: false

jobs:
  run:
    # The office PC (self-hosted runner, label bindal-office): www.myntra.com refuses GitHub's own
    # runners (26 Oct 2026: HTTP 403 for every style) and answers from the office line. Its Python is
    # the runner's venv (C:\Users\Bhikan\actions-runner\venv, first on PATH in the runner's .env,
    # with Git Bash for the bash steps); the PC's clock is already IST (no TZ: Windows reads it wrong).
    # runner=cloud (the worker picks it when the office PC's runner is offline): GitHub's runner, and
    # the styles are looked up by Ultron Phone, the Android app on a mobile line (core/phone.py).
    runs-on: ${{ inputs.runner == 'cloud' && 'ubuntu-latest' || fromJSON('["self-hosted", "bindal-office"]') }}
    timeout-minutes: 30
    env:
      RUN_MODE: github-actions
      # the repo is public: the run's log and output are uploaded only encrypted (scripts/github/ci_run.sh)
      ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MYNTRA_ZERO_TD_ACCOUNTS: ${{ vars.MYNTRA_ZERO_TD_ACCOUNTS }}
      # Drive AGENT WORK: the ZERO TD sheet is read there, each run's workbook kept there (new files
      # and folders through the owner's OAuth token)
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      AGENT_WORK_FOLDER_ID: ${{ vars.AGENT_WORK_FOLDER_ID }}
      # Ultron Phone, through the worker's /api/phone routes
      DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
      MYNTRA_ZERO_TD_VIA: ${{ inputs.runner == 'cloud' && 'phone' || vars.MYNTRA_ZERO_TD_VIA }}
    steps:
      - uses: actions/checkout@v4
      - if: inputs.runner == 'cloud'
        uses: ./.github/actions/setup
      - if: inputs.runner == 'cloud'      # IST on GitHub's runner (the office PC's clock is IST already)
        run: echo "TZ=Asia/Kolkata" >> "$GITHUB_ENV"
      - name: Install Ultron from this checkout
        if: inputs.runner != 'cloud'
        shell: bash
        run: python -m pip install -q -e ".[workings]"
      - name: Check the styles on myntra.com
        shell: bash
        run: bash scripts/github/ci_run.sh myntra-zero-td
      - name: Upload run output (encrypted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myntra-zero-td-${{ github.run_id }}
          path: secure/
          if-no-files-found: ignore
          retention-days: 3
