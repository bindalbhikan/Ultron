name: Lint

# docs/libraries/01-ruff.md: ruff's bug rules (F, E9, B) on every push and pull request. Not a bot run.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx --python 3.12 ruff@0.17.5 check src tests run.py

  # docs/libraries/03-pyright.md: type check of the seller-neutral core ([tool.pyright] in pyproject.toml)
  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: uv pip install --system "pyright==1.1.414"
      - run: pyright
