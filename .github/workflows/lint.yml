name: Lint

# docs/libraries/01-ruff.md: ruff's bug rules (F, E9, B) on every push and pull request. Not a bot run.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.17.5"
      - run: ruff check src tests run.py
