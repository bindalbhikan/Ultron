name: Flutter frontend

# The Ultron app (apps/ultron_app): checked on every change, then built for Android (APK), Windows,
# macOS and Linux on GitHub's runners; on main the builds go to Drive AGENT WORK/ULTRON APP (each file
# updated in place) and Telegram gets one note with the download links (scripts/github/flutter_app.py).
on:
  push:
    paths: ['apps/ultron_app/**', '.github/workflows/flutter-app.yml', 'scripts/github/flutter_app.py']
  pull_request:
    paths: ['apps/ultron_app/**', '.github/workflows/flutter-app.yml', 'scripts/github/flutter_app.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'
  APP_VERSION: 0.1.${{ github.run_number }}
  # the version code continues after the old Ultron Phone app's (up to 23), so ULTRON installs over it
  BUILD_NUMBER: 1${{ github.run_number }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/ultron_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build web --release --no-pub

  android:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # the signing key from Drive AGENT WORK/ULTRON PHONE (never in this public repo)
      AGENT_WORK_FOLDER_ID: ${{ vars.AGENT_WORK_FOLDER_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup
      - name: Signing key
        if: github.event_name != 'pull_request'
        run: python scripts/github/android_app.py keystore "$RUNNER_TEMP/keys"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build the APK
        working-directory: apps/ultron_app
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --no-pub --build-name "$APP_VERSION" --build-number "$BUILD_NUMBER" --dart-define=APP_VERSION="$APP_VERSION" --dart-define=BUILD_NUMBER="$BUILD_NUMBER"
          mkdir -p "$RUNNER_TEMP/out" && cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/out/ULTRON.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/out/ULTRON.apk
          retention-days: 7

  windows:
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ultron_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release --no-pub --build-name "$env:APP_VERSION" --build-number "$env:BUILD_NUMBER" --dart-define=APP_VERSION="$env:APP_VERSION" --dart-define=BUILD_NUMBER="$env:BUILD_NUMBER"
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\out" | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "$env:RUNNER_TEMP\out\ULTRON-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ runner.temp }}/out/ULTRON-Windows.zip
          retention-days: 7

  macos:
    needs: frontend
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/ultron_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build macos --release --no-pub --build-name "$APP_VERSION" --build-number "$BUILD_NUMBER" --dart-define=APP_VERSION="$APP_VERSION" --dart-define=BUILD_NUMBER="$BUILD_NUMBER"
      - name: Package
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          ditto -c -k --keepParent build/macos/Build/Products/Release/ULTRON.app "$RUNNER_TEMP/out/ULTRON-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ${{ runner.temp }}/out/ULTRON-macOS.zip
          retention-days: 7

  linux:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ultron_app
    steps:
      - uses: actions/checkout@v4
      - name: Linux build tools
        run: sudo apt-get update -q && sudo apt-get install -yq clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build linux --release --no-pub --build-name "$APP_VERSION" --build-number "$BUILD_NUMBER" --dart-define=APP_VERSION="$APP_VERSION" --dart-define=BUILD_NUMBER="$BUILD_NUMBER"
      - name: Package
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          tar -czf "$RUNNER_TEMP/out/ULTRON-Linux.tar.gz" -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ${{ runner.temp }}/out/ULTRON-Linux.tar.gz
          retention-days: 7

  publish:
    # what was built goes to Drive and Telegram, even when one platform failed (it is named "not built")
    needs: [android, windows, macos, linux]
    if: always() && needs.android.result != 'skipped' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENT_WORK_FOLDER_ID: ${{ vars.AGENT_WORK_FOLDER_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      APP_UPDATES_API: https://ultron-app-api.bhikan-serein.workers.dev
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - run: python scripts/github/flutter_app.py publish dist
