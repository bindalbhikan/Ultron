name: Flutter frontend

on:
  push:
    paths: ['apps/ultron_app/**', '.github/workflows/flutter-app.yml']
  pull_request:
    paths: ['apps/ultron_app/**', '.github/workflows/flutter-app.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/ultron_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build web --release --no-pub
