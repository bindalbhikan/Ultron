name: Ticket follow-up

on:
  # Started by the Telegram worker's cron (SCHEDULE in worker/src/worker.js) at 8 PM IST daily, or by hand / /ticketfollowup.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = nothing posted on any ticket, Drive still updated"
        default: ""
      no_upload:
        description: "1 = test run: nothing posted, Drive not changed"
        default: ""

concurrency:
  group: ticket-followup
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kolkata
      RUN_MODE: github-actions
      # the repo is public: the run's log and output are uploaded only encrypted (scripts/github/ci_run.sh)
      ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
      AGENT_WORK_FOLDER_ID: ${{ vars.AGENT_WORK_FOLDER_ID }}
      AJIO_USERNAME: ${{ secrets.AJIO_USERNAME }}
      AJIO_PASSWORD: ${{ secrets.AJIO_PASSWORD }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # the Myntra sessions are read from the worker with the dashboard token
      DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
      # inputs reach the shell only as variables, never pasted into the script
      IN_DRY_RUN: ${{ inputs.dry_run }}
      IN_NO_UPLOAD: ${{ inputs.no_upload }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run report
        run: |
          set --
          if [ -n "$IN_DRY_RUN" ]; then set -- "$@" --dry-run; fi
          if [ -n "$IN_NO_UPLOAD" ]; then set -- "$@" --no-upload; fi
          bash scripts/github/ci_run.sh ticket-followup "$@"
      - name: Upload run output (encrypted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticket-followup-${{ github.run_id }}
          path: secure/
          if-no-files-found: ignore
          retention-days: 14
