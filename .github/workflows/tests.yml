name: Tests

# The test suite on the bots' own setup (.github/actions/setup: uv.lock versions) on every push, any branch,
# and pull request: a change to the setup or a library is tried here before the bots run on it.
# Not a bot run (docs/libraries/02-uv.md).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: uv pip install --system "pytest>=8"
      - name: Versions installed
        run: python -c "import pandas, openpyxl, httpx, orjson, scrapy; print('pandas', pandas.__version__, 'openpyxl', openpyxl.__version__, 'httpx', httpx.__version__, 'orjson', orjson.__version__, 'scrapy', scrapy.__version__)"
      - run: python -m pytest -q tests
