name: Tests

# Ultron on every system it is hosted on: Linux, Windows, macOS with the full install, and the
# minimal pure-Python install that Android (Termux) gets.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        install: ["full"]
        include:
          - os: ubuntu-latest
            install: "minimal"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (full)
        if: matrix.install == 'full'
        run: pip install ".[full,workings,test]"
      - name: Install (minimal, as on Termux)
        if: matrix.install == 'minimal'
        run: pip install . pytest
      - run: ultron version
      - name: Tests
        run: python -m pytest -q ${{ matrix.install == 'minimal' && 'tests/agent' || '' }}
      - name: Worker module loads
        if: matrix.os == 'ubuntu-latest' && matrix.install == 'full'
        run: node -e "import('./worker/agent.js').then(m => { if (typeof m.makeAgent !== 'function') process.exit(1) })"
