name: Cloudflare deploy

# Applies the D1 migrations and deploys the Cloudflare parts from main, so no PC is needed (owner, 25 Nov 2026):
# the app API (services/app_api), the Telegram worker (worker/) and the dashboard (dashboard/). Started by hand
# (Actions tab, phone) or by the agent's deploy action after the owner approves it.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit, Workers KV: Edit, Workers R2
# Storage: Edit on the account) and, when the token reaches more than one account, CLOUDFLARE_ACCOUNT_ID.
# Wrangler is the app API's pinned version (services/app_api/package-lock.json). Worker secrets stay as they are.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "What to deploy: all, or a comma list of migrations, app-api, worker, dashboard"
        default: "all"
      chat_id:
        description: "Telegram chat to tell (empty or an app chat = the owner's chat)"
        default: ""

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IN_TARGETS: ${{ inputs.targets }}
    steps:
      - name: Token set?
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the repository secret CLOUDFLARE_API_TOKEN (see the top of this workflow)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/app_api/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: services/app_api
      - name: What to deploy
        id: want
        run: |
          t=",$(echo "${IN_TARGETS:-all}" | tr -d ' ' | tr 'A-Z' 'a-z'),"
          for part in migrations app-api worker dashboard; do
            if [ "$t" = ",all," ] || [[ "$t" == *",$part,"* ]]; then echo "${part//-/_}=1" >> "$GITHUB_OUTPUT"; fi
          done
      # migrations first: the new code may read a new table
      - name: D1 migrations
        if: steps.want.outputs.migrations == '1'
        working-directory: services/app_api
        run: npx wrangler d1 migrations apply ultron --remote
      - name: App API
        if: steps.want.outputs.app_api == '1'
        working-directory: services/app_api
        run: npx wrangler deploy
      - name: Telegram worker
        if: steps.want.outputs.worker == '1'
        working-directory: worker
        run: ../services/app_api/node_modules/.bin/wrangler deploy
      - name: Dashboard
        if: steps.want.outputs.dashboard == '1'
        working-directory: dashboard
        run: ../services/app_api/node_modules/.bin/wrangler deploy
      - name: Telegram
        if: always()
        env:
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ (inputs.chat_id != '' && !startsWith(inputs.chat_id, 'app:')) && inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ "$STATUS" = "success" ] && icon="✅" || icon="❌"
          text=$(printf '%s Cloudflare deploy (%s): %s\n%s' "$icon" "${IN_TARGETS:-all}" "$STATUS" "$RUN_URL")
          IFS=',' read -ra chats <<< "$TELEGRAM_CHAT_ID"
          for chat in "${chats[@]}"; do
            curl -s -o /dev/null "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=${chat// /}" --data-urlencode "text=$text"
          done
