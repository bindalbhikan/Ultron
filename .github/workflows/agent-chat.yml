name: Agent chat

on:
  # Started by the Telegram worker for a plain-text message in an allowed chat (worker askAgent).
  workflow_dispatch:
    inputs:
      text:
        description: "The owner's message"
        default: ""
      chat_id:
        description: "Telegram chat to answer in"
        required: true
      app_request:
        description: "Private app chat request id (message read from the worker)"
        default: ""
      reply_to:
        description: "Telegram message id answered"
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: agent-chat-${{ inputs.chat_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Kolkata
      RUN_MODE: github-actions
      # the repo is public: this run's log is uploaded only encrypted (scripts/github/ci_run.sh)
      ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      AGENT_WORK_FOLDER_ID: ${{ vars.AGENT_WORK_FOLDER_ID }}
      # Drive: the business facts the agent answers sale / return / GMV questions from (tools/business.py)
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      OMSGURU_EMAIL: ${{ secrets.OMSGURU_EMAIL }}
      OMSGURU_PASSWORD: ${{ secrets.OMSGURU_PASSWORD }}
      OMSGURU_OTP: ${{ secrets.OMSGURU_OTP }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ inputs.chat_id }}
      # the model (/api/ai) and the approvals (/api/approval) are in the Telegram worker
      DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AGENT_MODEL_TIER: ${{ vars.AGENT_MODEL_TIER }}
      AGENT_MODEL_ORDER: ${{ vars.AGENT_MODEL_ORDER }}
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
      # the message reaches the shell only as a variable, never pasted into the script
      IN_TEXT: ${{ inputs.text }}
      IN_APP_REQUEST: ${{ inputs.app_request }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      - name: Answer
        run: |
          if [ -n "$IN_APP_REQUEST" ]; then
            bash scripts/github/ci_run.sh agent-chat --app-request "$IN_APP_REQUEST" --no-telegram
          else
            bash scripts/github/ci_run.sh agent-chat --text "$IN_TEXT"
          fi
      - name: Upload run output (encrypted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-chat-${{ github.run_id }}
          path: secure/
          if-no-files-found: ignore
          retention-days: 7
