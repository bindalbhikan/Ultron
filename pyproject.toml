[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron"
dynamic = ["version"]
description = "Ultron, Ecom Manager: an AI e-commerce manager for marketplace sellers, on Telegram"
readme = "README.md"
requires-python = ">=3.12"
# pure-Python only, so it installs anywhere, Android (Termux) included
dependencies = [
    # HTTP (ultron.core.http, docs/libraries/08-httpx.md); pure Python
    "httpx>=0.27",
    # HTML fallback where selectolax (C) is not installed (ultron.core.html, docs/libraries/09-selectolax.md)
    "beautifulsoup4>=4.12",
    # one retry helper, ultron.core.retry (docs/libraries/04-tenacity.md); pure Python
    "tenacity>=9.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# xlsx summaries of run files (pandas, openpyxl) and reading encrypted GitHub run artifacts
# (cryptography); on Termux these come from pkg instead (deploy/termux/setup.sh)
full = ["pandas>=2.2,<4", "openpyxl>=3.1", "cryptography>=42"]
# the agent's browser (ultron.core.browser); then run: patchright install chromium
browser = ["patchright>=1.64,<2"]
# the report workings (ultron.workings: sale, VMS, AJIO TAT / SPF, Myntra SPF, returns ...)
workings = [
    "pandas>=2.2,<4", "openpyxl>=3.1", "cryptography>=42",
    # google-auth's Drive transport and gspread run on requests (no httpx transport there)
    "google-auth>=2.23", "gspread>=6.0", "requests>=2.31",
    # big JSON answers read by orjson (ultron.core.jsonx; the core falls back to json)
    "orjson>=3.10",
    "curl_cffi>=0.7", "selectolax>=0.3.21",
    # pypdfium2 renders shipping labels to PIL images (without Pillow every Shadowfax / Delhivery
    # label fails and those Myntra orders show as NO VMS) and reads the courier POD PDFs as text
    "pypdfium2>=4.30", "zxing-cpp>=2.2", "pillow>=10.0",
    # Myntra SPF master: fast streaming writer, and the fast (Rust) xlsx reader for the big payment exports
    "xlsxwriter>=3.1", "python-calamine>=0.2",
    # Myntra zero TD: the buyer-side product API, many styles at once
    "scrapy>=2.13",
    # portal answers checked before a working reads them (docs/libraries/05-pydantic.md); a bot's settings
    # checked at its start (pydantic-settings, docs/libraries/10-small.md)
    "pydantic>=2.9", "pydantic-settings>=2.6",
    # tables (docs/libraries/06-polars.md): Polars for new code, pandas moved out working by working
    "polars>=1.30",
    # pl.read_excel(engine="calamine"): typed sheets straight into Polars (Rust; docs/libraries/06-polars.md)
    "fastexcel>=0.12",
]

[project.scripts]
ultron = "ultron.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ultron.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# docs/libraries/01-ruff.md: lint gate for bugs only (style is left alone); run: python -m ruff check
line-length = 130
target-version = "py312"
extend-exclude = ["scripts/legacy", "netcap", "output", ".claude"]

[tool.ruff.lint]
select = ["F", "E9", "B"]
# B905 (zip strict) and B023 (loop variable in a closure) are reviewed one by one, not gated yet
ignore = ["B905", "B023"]

[tool.pyright]
# docs/libraries/03-pyright.md: the seller-neutral core first (src/ultron without workings/), basic mode;
# the workings folder by folder once each is clean
include = ["src/ultron"]
exclude = ["src/ultron/workings", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingModuleSource = "none"
