[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron"
dynamic = ["version"]
description = "Ultron, Ecom Manager: an AI e-commerce manager for marketplace sellers, on Telegram"
readme = "README.md"
requires-python = ">=3.12"
# pure-Python only, so it installs anywhere, Android (Termux) included
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# xlsx summaries of run files (pandas, openpyxl) and reading encrypted GitHub run artifacts
# (cryptography); on Termux these come from pkg instead (deploy/termux/setup.sh)
full = ["pandas>=2.2", "openpyxl>=3.1", "cryptography>=42"]
# the report workings (ultron.workings: sale, VMS, AJIO TAT / SPF, Myntra SPF, returns ...)
workings = [
    "pandas>=2.2", "openpyxl>=3.1", "cryptography>=42",
    "google-auth>=2.23", "gspread>=6.0",
    "curl_cffi>=0.7", "selectolax>=0.3.21",
    # pypdfium2 renders shipping labels to PIL images: without Pillow every Shadowfax / Delhivery
    # label fails and those Myntra orders show as NO VMS
    "pypdfium2>=4.30", "zxing-cpp>=2.2", "pillow>=10.0",
    # Myntra SPF master: fast streaming writer, and the fast (Rust) xlsx reader for the big payment exports
    "xlsxwriter>=3.1", "python-calamine>=0.2",
]
test = ["pytest>=8.0", "pandas>=2.2", "openpyxl>=3.1"]

[project.scripts]
ultron = "ultron.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ultron.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
